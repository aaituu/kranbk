services:
  marroni-postgresql:
    image: postgres:17.0-alpine3.20
    container_name: marroni-postgresql
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PSWD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5433:5432'
    volumes:
      - db-marroni:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: 'pg_isready'
      interval: 30s
      timeout: 3s
      retries: 3
    restart: always

networks:
  app-network:
    external: true

volumes:
  db-marroni:
    driver: local
